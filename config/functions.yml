categoryApi:
  handler: src/handlers/category.handler
  timeout: 300
  events:
    - http:
        path: category
        method: post
    - http:
        path: category/{id}
        method: get
    - http:
        path: category/{id}
        method: patch
    - http:
        path: category/{id}
        method: delete
    - http:
        path: categories
        method: get

