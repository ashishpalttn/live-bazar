shopApi:
  handler: src/handlers/shop.handler
  timeout: 300
  events:
    - http:
        path: shop
        method: post
    - http:
        path: shop/{id}
        method: get
    - http:
        path: shop/{id}
        method: patch
    - http:
        path: shop/{id}
        method: delete
    - http:
        path: shops
        method: get

testFunction:
  handler: src/handlers/test.handler
  events:
    - http:
        path: test
        method: get
