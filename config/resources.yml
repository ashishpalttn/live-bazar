Resources:

  categories:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: categories
      AttributeDefinitions:
        - AttributeName: categoryId
          AttributeType: S
      KeySchema:
        - AttributeName: categoryId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  vendors:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vendors
      AttributeDefinitions:
        - AttributeName: vendor_id
          AttributeType: S
      KeySchema:
        - AttributeName: vendor_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  products:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: products
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  vendorProduct:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vendor-product
      AttributeDefinitions:
        - AttributeName: vp_id
          AttributeType: S
        - AttributeName: vendor_id
          AttributeType: S
      KeySchema:
        - AttributeName: vp_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: vendor_id-index
          KeySchema:
            - AttributeName: vendor_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
            
  productsV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: products-v2
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
        - AttributeName: product_Name
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: productName-index
          KeySchema:
            - AttributeName: product_Name
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
  
  vendorProductV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vendor-products-v2
      AttributeDefinitions:
        - AttributeName: vendor_id
          AttributeType: S
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: vendor_id
          KeyType: HASH
        - AttributeName: product_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  bills:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bills
      AttributeDefinitions:
        - AttributeName: bill_id
          AttributeType: S
      KeySchema:
        - AttributeName: bill_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  vendorCustomerMap:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vendor_customer_map
      AttributeDefinitions:
        - AttributeName: vendor_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: mobileNumber
          AttributeType: S
      KeySchema:
        - AttributeName: vendor_id
          KeyType: HASH
        - AttributeName: customer_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: mobileNumber-index
          KeySchema:
            - AttributeName: mobileNumber
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  orders:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: orders
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST