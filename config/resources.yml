  shops:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: shops
      AttributeDefinitions:
        - AttributeName: shopId
          AttributeType: S
      KeySchema:
        - AttributeName: shopId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  
  categories:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: categories
      AttributeDefinitions:
        - AttributeName: categoryId
          AttributeType: S
      KeySchema:
        - AttributeName: categoryId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  vendors:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vendors
      AttributeDefinitions:
        - AttributeName: vendor_id
          AttributeType: S
      KeySchema:
        - AttributeName: vendor_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST