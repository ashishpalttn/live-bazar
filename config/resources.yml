  OrderTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: OrderTable
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  shops:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: shops
      AttributeDefinitions:
        - AttributeName: shopId
          AttributeType: S
      KeySchema:
        - AttributeName: shopId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
