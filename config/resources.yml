Resources:

  categories:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: categories
      AttributeDefinitions:
        - AttributeName: categoryId
          AttributeType: S
      KeySchema:
        - AttributeName: categoryId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  vendors:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vendors
      AttributeDefinitions:
        - AttributeName: vendor_id
          AttributeType: S
      KeySchema:
        - AttributeName: vendor_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  products:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: products
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  vendorProduct:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vendor-product
      AttributeDefinitions:
        - AttributeName: vp_id
          AttributeType: S
        - AttributeName: vendor_id
          AttributeType: S
      KeySchema:
        - AttributeName: vp_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: vendor_id-index
          KeySchema:
            - AttributeName: vendor_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
            
  productsV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: products-v2
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  
  vendorProductV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vendor-products-v2
      AttributeDefinitions:
        - AttributeName: vendor_id
          AttributeType: S
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: vendor_id
          KeyType: HASH
        - AttributeName: product_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST